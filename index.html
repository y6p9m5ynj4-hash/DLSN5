<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club Intelligence</title>
<link rel="apple-touch-icon" sizes="180x180" href="https://y6p9m5ynj4-hash.github.io/DLSN4/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Club Intel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120d18">
<style>
:root{--bg:#120d18;--card:#1c1525;--bd:#32263f;--tx:#f6f1f8;--mu:#a597b2;--g:#3ccf8e;--a:#f2b53c;--r:#ee6262;--ac:#9a5bd9;--on:#fff;--br:#b08968;--glow:#2b1740;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f6f2f9;--card:#fff;--bd:#e3d9ea;--tx:#1d1326;--mu:#6b5a7a;--ac:#6b2fa8;--on:#fff;--glow:#e6d6f5}:root[data-theme="mono"]{--bg:#000;--card:#111;--bd:#2a2a2a;--tx:#fff;--mu:#9a9a9a;--ac:#fff;--on:#000;--br:#bbb;--glow:#1a1a1a}:root[data-theme="brown"]{--bg:#17110d;--card:#221a14;--bd:#3a2d23;--tx:#f7efe8;--mu:#b19c8a;--ac:#c49a6c;--on:#1a120c;--br:#8a5fa8;--glow:#33231a}
*{box-sizing:border-box}html,body{margin:0;color:var(--tx);font:1rem/1.4 -apple-system,"SF Pro Display",system-ui,sans-serif;background:radial-gradient(800px 380px at 50% -120px,var(--glow),transparent 70%),var(--bg);background-repeat:no-repeat;background-color:var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
main{max-width:720px;margin:0 auto;padding:18px 14px 100px}
h1{font-size:28px;letter-spacing:-.02em;margin:6px 0 2px}h2{font-size:12px;margin:0 0 10px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.09em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.mu{color:var(--mu);font-size:.82rem}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,input,textarea,select{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:14px;min-height:44px;padding:0 14px;cursor:pointer}
button.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
button.pri{background:linear-gradient(135deg,var(--ac),var(--br));color:var(--on);border:0;width:100%;font-weight:700;min-height:52px}
button.del{color:var(--r)}
input,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:12px;min-height:44px;padding:6px 10px;width:100%}
label{display:block;margin:8px 0 2px;font-size:13px;color:var(--mu)}
nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:22px;display:flex;padding:4px;max-width:700px;margin:0 auto}
nav button{border:0;background:none;flex:1;font-size:11px;display:flex;flex-direction:column;min-height:50px;color:var(--mu);padding:0}
nav button.on{color:var(--ac);background:none}nav b{font-size:19px;line-height:1.15}
.fac{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fac button{text-align:left;height:auto;padding:12px;border-radius:18px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-weight:700;color:#0b1220;font-size:12px}
.L1,.L2{background:var(--g)}.L3{background:var(--a)}.L4,.L5{background:var(--r)}
.big{font-size:60px;font-weight:700;letter-spacing:-.04em;line-height:1}
.hm{display:grid;grid-template-columns:34px repeat(7,1fr);gap:2px}
.hm div{text-align:center;font-size:10px;padding:4px 0;border-radius:4px;color:#0b1220;font-weight:700;min-height:20px}
.hm .h{color:var(--mu);font-weight:400;background:none;text-align:right;padding-right:4px}.hm .hd{color:var(--mu);background:none;font-size:12px}
.hm .x{background:repeating-linear-gradient(45deg,#7a5fd0,#7a5fd0 3px,#4b3a8c 3px,#4b3a8c 6px);color:#fff}
.hm .z{background:var(--bd);opacity:.35}
.rate{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.rate button{padding:0;font-weight:700;font-size:13px}
.chips button{min-height:38px;font-size:14px}
svg{width:100%;height:auto;display:block}textarea{min-height:90px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px 2px;text-align:left;border-top:1px solid var(--bd)}
summary{cursor:pointer;min-height:36px;color:var(--ac)}
.warn{border-color:#7a5fd0}
</style></head>
<body><main id="app"></main><nav id="nav"></nav>
<script>
const F={gym:['Gym',['Weights','Cardio','Classes','Stretching','Other']],pool:['Pool',['Lengths','Leisure swim','Other']],spa:['Spa',['Sauna','Steam room','Jacuzzi','Other']],club:['Clubroom',['Coffee/food','Working','Relaxing','Socialising','Other']]};
const LB=['','Very quiet','Quiet','Moderate','Busy','Very busy'],DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
/* hours: [Mon-Fri, Sat, Sun] decimal hours. A = assumed (not supplied) */
const H={gym:[[6,21.75],[6,20.75],[7,20.75]],spa:[[6.5,21.75],[6.5,20.75],[7.5,20.75]],pool:[[6,21.75],[6,20.75],[7,20.75]],club:[[6.5,21.75],[6.5,20.75],[7.5,20.75]]};
const ASSUMED={gym:'',spa:'',pool:'',club:''};
const FOOD=[[0,0],[0,0]];
const g=(h,m,s)=>Math.exp(-((h-m)**2)/(2*s*s));
const BASE={gym:[h=>1.4+2.6*g(h,18,1.5)+1.6*g(h,7,1)+.8*g(h,12.5,.8),h=>1.3+2.2*g(h,10.5,2)],pool:[h=>1.3+2*g(h,17.5,1.5)+1.5*g(h,7,1)+.6*g(h,12.5,1),h=>1.5+2.5*g(h,11,2.2)],spa:[h=>1.3+2.5*g(h,19,1.8)+.5*g(h,12,1),h=>1.8+2.5*g(h,15,3)],club:[h=>1.4+1.6*g(h,12.5,1.2)+1.5*g(h,9.5,1),h=>1.6+2.4*g(h,11,2.5)]};
const S={tab:'dash',fac:'gym',date:null,sel:null,visits:[],cfg:{half:60,k:2,bk:null},f:null,msg:'',out:'',cal:null,calDay:null};
let db=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lvl=v=>clamp(Math.round(v),1,5),pct=v=>Math.round(clamp((v-.5)*20,0,100));
const fmt=t=>{const m=Math.round(t*60);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function now(){const p={};new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);const hh=+p.hour%24;return{date:`${p.year}-${p.month}-${p.day}`,t:hh+(+p.minute>=30?.5:0),time:String(hh).padStart(2,'0')+':'+p.minute}}
const dow=d=>new Date(d+'T12:00:00Z').getUTCDay(),isWE=w=>w==0||w==6;
const win=(f,w)=>H[f][w==0?2:w==6?1:0];
function hrs(f,w){const[o,c]=win(f,w),out=[];for(let t=o;t<c;t+=.5)out.push(t);return out}
function restrict(f,w,t){if(f==='spa'){if(w==4&&t>=19&&t<21)return{k:'avoid',s:'♀',n:'Women only 19:00–21:00'};if(w==0&&t>=16&&t<19)return{k:'avoid',s:'👪',n:'Family spa 16:00–19:00'}}
 if(f==='pool'){const fam=w==0||w==6?t>=9&&t<19:t>=10&&t<19;return fam?{k:'fam',s:'',n:'Family swim'}:{k:'adult',s:'',n:'Adult only'}}return null}
const tm=s=>{const[a,b]=(s||'0:0').split(':').map(Number);return a+b/60};
function predict(f,t,w,ref){const we=isWE(w),b=BASE[f][we?1:0](t),today=ref||now().date;let sw=0,sr=[],ws=0,n=0,last=null;
 for(const v of S.visits){const o=v.facs&&v.facs[f];if(!o||!o.r||isWE(dow(v.date))!==we)continue;const a=tm(v.arr),d=v.dep?tm(v.dep):a+1;if(a>=t+.5||d<=t)continue;
  const age=Math.max(0,(new Date(today)-new Date(v.date))/864e5),wt=Math.pow(.5,age/S.cfg.half);sw+=wt*o.r;ws+=wt;sr.push(o.r);n++;if(!last||v.date>last)last=v.date}
 const val=(S.cfg.k*b+sw)/(S.cfg.k+ws),mean=sr.reduce((a,x)=>a+x,0)/(n||1),sd=n>1?Math.sqrt(sr.reduce((a,x)=>a+(x-mean)**2,0)/n):0;
 return{v:val,L:lvl(val),p:pct(val),b,n,conf:n<3?'Low':(n>=8&&sd<1.1)?'High':'Medium',last,obs:n?mean:null}}
const curve=(f,date)=>{const w=dow(date);return hrs(f,w).map(t=>({t,r:restrict(f,w,t),...predict(f,t,w,date)}))};
function bestWindow(f){const n=now();for(let i=0;i<7;i++){const d=new Date(n.date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+i);const ds=d.toISOString().slice(0,10),w=dow(ds),c=curve(f,ds),close=win(f,w)[1];let best=null;for(let j=0;j+1<c.length;j++){const a=c[j],b=c[j+1];if(a.t+1.5>close)break;if(i==0&&a.t<=n.t)continue;if((a.r&&a.r.k=='avoid')||(b.r&&b.r.k=='avoid'))continue;const v=(a.v+b.v)/2;if(!best||v<best.v)best={...a,v,p:pct(v),L:lvl(v),end:a.t+1}}if(best)return{ds,w,today:i==0,...best}}}
const pill=L=>`<span class="pill L${L}">${LB[L]}</span>`;
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const idb=(m,fn)=>new Promise((res,rej)=>{if(!db)return res(null);const t=db.transaction('s',m),r=fn(t.objectStore('s'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)});
async function load(){try{db=await new Promise((res,rej)=>{const q=indexedDB.open('dlci',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});const d=await idb('readonly',s=>s.get('data'));if(d){S.visits=d.visits||[];S.cfg={...S.cfg,...d.cfg}}}catch(e){db=null;S.msg='Storage unavailable: data will not persist.'}}
async function save(){try{await idb('readwrite',s=>s.put({visits:S.visits,cfg:S.cfg},'data'))}catch(e){S.msg='Could not save.'}}
function hoursText(f,w){const[o,c]=win(f,w);let s=`${fmt(o)}–${fmt(c)}`;if(f==='club')s+=` · food ${w==0?'08:00':'07:00'}–${w==0||w==6?'19:45':'20:45'}`;return s}
function chart(f,date,sel){const c=curve(f,date),W=340,H2=170,p=28,bw=(W-p-8)/c.length,x=i=>p+i*bw+bw/2,y=v=>H2-22-v*(H2-36)/100,col=L=>L<=2?'var(--g)':L==3?'var(--a)':'var(--r)';
 let s=`<svg viewBox="0 0 ${W} ${H2}" role="img" aria-label="Estimated percent busy by half hour">`;
 [0,25,50,75,100].forEach(l=>s+=`<line x1="${p}" x2="${W-8}" y1="${y(l)}" y2="${y(l)}" stroke="var(--bd)"/><text x="2" y="${y(l)+3}" font-size="9" fill="var(--mu)">${l}%</text>`);
 c.forEach((d,i)=>{if(d.r&&d.r.k=='avoid')s+=`<rect x="${p+i*bw}" y="6" width="${bw}" height="${H2-28}" fill="#7a5fd0" opacity=".3"/>`});
 s+=`<polyline fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" points="${c.map((d,i)=>x(i)+','+y(d.p)).join(' ')}"/>`;
 c.forEach((d,i)=>{if(d.n)s+=`<circle cx="${x(i)}" cy="${y(d.p)}" r="3.5" fill="${col(d.L)}"/>`;if(sel===d.t)s+=`<circle cx="${x(i)}" cy="${y(d.p)}" r="6" fill="${col(d.L)}" stroke="var(--tx)" stroke-width="2"/>`;
  s+=`<rect data-a="sel" data-t="${d.t}" x="${p+i*bw}" y="0" width="${bw}" height="${H2-14}" fill="transparent"/>`;if(d.t%2==0)s+=`<text x="${x(i)}" y="${H2-4}" font-size="9" text-anchor="middle" fill="var(--mu)">${d.t}</text>`});
 const n=now(),i=c.findIndex(d=>d.t===n.t);if(date===n.date&&i>=0)s+=`<line x1="${x(i)}" x2="${x(i)}" y1="6" y2="${H2-20}" stroke="var(--tx)" stroke-dasharray="3 3"/>`;return s+'</svg>'}
function detail(f,w,t,date){const d=predict(f,t,w,date),r=restrict(f,w,t);return `<div style="margin-top:8px;border-top:1px solid var(--bd);padding-top:8px"><b>${DN[w]} ${fmt(t)}</b> · <b>${d.p}% busy</b> ${pill(d.L)}${r&&r.k=='avoid'?`<div><b style="color:#a58cff">${r.s} Avoid: ${r.n}</b></div>`:r&&f=='pool'?`<div class="mu">${r.n}</div>`:''}<div class="mu">${d.n?`${d.n} observation${d.n>1?'s':''} (latest ${d.last}), observed avg ${Math.round(d.obs*20-10)}%, estimate ${pct(d.b)}%`:'Initial estimate — not enough personal observations yet'}<br>Confidence <b>${d.conf}</b>${d.n<3?' (fewer than 3 observations)':''}</div></div>`}
function dash(){const n=now(),d=S.date||n.date,w=dow(d),f=S.fac,op=hrs(f,w),isT=d===n.date,open=!isT||op.includes(n.t),t0=isT&&open?n.t:op[Math.min(op.length-1,Math.round(op.length/2))],p=predict(f,t0,w,d),r=restrict(f,w,t0),bw=bestWindow(f),c0=curve(f,d),tot=c0.reduce((a,x)=>a+x.n,0);
 const ws0=new Date(n.date+'T12:00:00Z');ws0.setUTCDate(ws0.getUTCDate()-((dow(n.date)+6)%7));const ws=ws0.toISOString().slice(0,10),wv=S.visits.filter(v=>v.date>=ws),mins=wv.reduce((a,v)=>a+(v.dep?Math.max(0,(tm(v.dep)-tm(v.arr))*60):0),0);
 const stale=S.visits.length&&(!S.cfg.bk||(new Date(n.date)-new Date(S.cfg.bk))/864e5>14);
 return `<div class="row" style="gap:12px;flex-wrap:nowrap">${S.cfg.logo?`<img src="${S.cfg.logo}" alt="Logo" style="height:44px;max-width:120px;object-fit:contain;border-radius:8px">`:'<img src="header-logo.png" alt="Club Intelligence" style="height:44px;width:auto;max-width:140px;object-fit:contain;border-radius:10px" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="none" stroke="var(--ac)" stroke-width="2"/><path d="M8 22c4-5 8 5 12 0s8 5 12 0" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linecap="round"/></svg></span>'}<h1 style="margin:0">Club Intelligence</h1></div><div class="mu" style="margin-top:4px">St Neots · ${n.time} · estimates</div>
 ${stale?`<div class="card warn"><b>Back up your visits</b><div class="mu">${S.cfg.bk?'Last: '+S.cfg.bk:'Never backed up'}</div><button data-a="tab" data-k="set" style="margin-top:8px">Go to backup</button></div>`:''}
 <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${F[f][0]} · ${isT&&open?'now':fmt(t0)}</h2><input type="date" data-k="date" value="${d}" style="width:auto;min-height:36px"></div>
 <div class="row" style="margin-top:10px;gap:14px;align-items:flex-end"><div class="big">${p.p}<span style="font-size:24px">%</span></div><div>${pill(p.L)}<div class="mu">${p.conf} confidence${p.n?`, ${p.n} obs`:' · initial estimate'}</div></div></div>
 ${r&&r.k=='avoid'?`<div style="color:#a58cff;margin-top:8px"><b>${r.s} Avoid: ${r.n}</b></div>`:''}${!open?`<div class="mu" style="margin-top:6px">Closed now. Hours today ${hoursText(f,w)}.</div>`:`<div class="mu" style="margin-top:6px">Open ${hoursText(f,w)}</div>`}
 ${bw?`<div style="margin-top:10px;border-top:1px solid var(--bd);padding-top:10px">Best next slot: <b>${bw.today?'Today':DN[bw.w]+' '+bw.ds.slice(5)} ${fmt(bw.t)}–${fmt(bw.end)}</b> · ~${bw.p}% ${bw.conf=='Low'?'<span class="mu">(tentative)</span>':''}</div>`:''}</div>
 <div class="fac">${Object.keys(F).map(k=>{const hh=win(k,w),tt=clamp(t0,hh[0],hh[1]-.5),q=predict(k,tt,w,d);return `<button class="${k===f?'on':''}" data-a="fac" data-k="${k}"><b>${F[k][0]}</b><div style="font-size:26px;font-weight:700">${q.p}%</div><span style="font-size:12px;opacity:.8">${fmt(win(k,w)[0])}–${fmt(win(k,w)[1])}</span></button>`}).join('')}</div>
 <div class="card"><h2>${DN[w]} forecast · % busy</h2>${chart(f,d,S.sel)}${S.sel!=null?detail(f,w,S.sel,d):'<div class="mu">Tap a slot for detail</div>'}<div class="mu" style="margin-top:6px">${tot?`${tot} observation-slots support this day`:'Initial estimate — not enough personal observations yet'}</div></div>
 <div class="card"><h2>Opening hours</h2>${hoursTable()}</div>
 <div class="card"><h2>This week</h2><b>${wv.length}</b> visits · <b>${Math.round(mins/6)/10}</b> h · ${S.visits.length} logged in total</div>
 <div class="card"><h2>Recent visits</h2>${S.visits.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.arr.localeCompare(a.arr)).slice(0,4).map(vrow).join('')||'<div class="mu">No visits yet. Log one to start improving the estimates.</div>'}</div>`}
function hoursTable(){return `<table><tr><th></th><th>Mon–Fri</th><th>Sat</th><th>Sun</th></tr>${Object.keys(F).map(k=>`<tr><td><b>${F[k][0]}</b></td>${[1,6,0].map(w=>`<td>${fmt(win(k,w)[0])}–${fmt(win(k,w)[1])}</td>`).join('')}</tr>`).join('')}</table>
 <div class="mu" style="margin-top:8px">${S.tab!='set'?'♀ Thu 19–21 · 👪 Sun 16–19 · spa: avoid':`Pool: adult only Mon–Fri 06–10 &amp; 19:00–close, family 10–19; Sat family 09–19, adult 06–09 &amp; 19:00–close; Sun adult 07–09 &amp; 19:00–close, family 09–19.<br>Clubroom food: Mon–Fri 07:00–20:45, Sat 07:00–19:45, Sun 08:00–19:45.<br><b style="color:#a58cff">♀ Spa women only Thu 19:00–21:00 · 👪 Family spa Sun 16:00–19:00 (avoided in recommendations)</b>`}</div>`}
const vrow=v=>`<div class="row" style="justify-content:space-between;border-top:1px solid var(--bd);padding:8px 0"><div><b>${v.date} ${v.arr}${v.dep?'–'+v.dep:''}</b><div class="mu">${Object.keys(v.facs||{}).map(k=>F[k][0]+(v.facs[k].r?' '+(v.facs[k].r*20-10)+'%':'')).join(' · ')||'No facilities'}${v.hannah?' · with Hannah':''}</div></div><button class="del" data-a="del" data-id="${v.id}" aria-label="Delete visit">✕</button></div>`;
function heat(){const f=S.fac,all=[0,1,2,3,4,5,6].map(w=>win(f,w)),lo=Math.min(...all.map(a=>a[0])),hi=Math.max(...all.map(a=>a[1])),days=[1,2,3,4,5,6,0];let min={v:9},rows='';
 for(let t=lo;t<hi;t+=.5){rows+=`<div class="h">${t%1?'':Math.floor(t)}</div>`+days.map(w=>{if(!hrs(f,w).includes(t))return '<div class="z"></div>';const p=predict(f,t,w),r=restrict(f,w,t);if(r&&r.k=='avoid')return `<div class="x" data-a="cell" data-t="${t}" data-w="${w}">${r.s}</div>`;if(p.v<min.v)min={v:p.v,t,w,p:p.p};const sl=S.sel&&S.sel.t==t&&S.sel.w==w;return `<div class="L${p.L}" data-a="cell" data-t="${t}" data-w="${w}" style="opacity:${p.n?1:.6};${sl?'outline:2px solid var(--tx)':''}">${p.p}</div>`}).join('')}
 return `<h1>Weekly heatmap</h1><div class="row chips">${Object.keys(F).map(k=>`<button class="${k===f?'on':''}" data-a="fac" data-k="${k}">${F[k][0]}</button>`).join('')}</div>
 <div class="card"><div class="hm"><div class="h"></div>${days.map(w=>`<div class="hd">${DN[w]}</div>`).join('')}${rows}</div><div class="mu" style="margin-top:8px">% busy per 30 min · faded = estimate only · ♀ 👪 avoid</div></div>
 <div class="card">${min.t!=null?`Quietest slot: <b>${DN[min.w]} ${fmt(min.t)}</b> · ${min.p}%`:''}${S.sel&&S.sel.w!=null?detail(f,S.sel.w,S.sel.t):'<div class="mu">Tap a cell to inspect it.</div>'}</div>`}
function logv(){const f=S.f||(S.f=(()=>{const h=clamp(Math.floor(now().t),0,22),p=x=>String(x).padStart(2,'0')+':00';return{date:now().date,arr:p(h),dep:p(h+1),hannah:false,notes:'',facs:{}}})());
 return `<h1>Log visit</h1><div class="card"><input type="date" data-k="f.date" value="${f.date}"><div class="row" style="margin-top:10px;justify-content:space-between;flex-wrap:nowrap"><button data-a="slot" data-n="-1" aria-label="Earlier hour">‹</button><div style="font-size:28px;font-weight:700;letter-spacing:-.02em">${f.arr}–${f.dep}</div><button data-a="slot" data-n="1" aria-label="Later hour">›</button></div>
 <label><input type="checkbox" data-k="f.hannah" ${f.hannah?'checked':''} style="width:auto;min-height:0"> Hannah came too</label></div>
 ${Object.keys(F).map(k=>{const o=f.facs[k];return `<div class="card"><button class="${o?'on':''}" data-a="ft" data-k="${k}" style="width:100%">${o?'✓ ':''}${F[k][0]}</button>${o?`<div class="rate" style="margin-top:8px">${[1,2,3,4,5,0].map(r=>`<button class="${o.r===r?'on':''}" data-a="rate" data-k="${k}" data-r="${r}" aria-label="${r?LB[r]:'Not observed'}">${r?r*20-10+'%':'n/a'}</button>`).join('')}</div><div class="mu">${o.r?LB[o.r]:'Not observed'}</div><div class="row chips" style="margin-top:6px">${F[k][1].map(a=>`<button class="${o.acts.includes(a)?'on':''}" data-a="act" data-k="${k}" data-t="${a}">${a}</button>`).join('')}</div>`:''}</div>`}).join('')}
 <div class="card"><label>Notes</label><textarea data-k="f.notes">${esc(S.f.notes)}</textarea></div>
 <button class="pri" data-a="save">Save visit</button><div class="mu" style="margin-top:8px">${S.msg}</div>`}
function cal(){const n=now(),m=S.cal||n.date.slice(0,7),[Y,M]=m.split('-').map(Number),first=new Date(Date.UTC(Y,M-1,1,12)),off=(first.getUTCDay()+6)%7,dim=new Date(Date.UTC(Y,M,0)).getUTCDate();
 let cells='';for(let i=0;i<off;i++)cells+='<div></div>';
 for(let d=1;d<=dim;d++){const ds=`${m}-${String(d).padStart(2,'0')}`,vs=S.visits.filter(v=>v.date===ds);cells+=`<button data-a="day" data-d="${ds}" class="${S.calDay===ds?'on':''}" style="min-height:48px;padding:2px;font-size:13px">${d}<br><span style="color:var(--g)">${'●'.repeat(Math.min(3,vs.length))}</span></button>`}
 const sel=S.calDay?S.visits.filter(v=>v.date===S.calDay):[];
 return `<h1>History</h1><div class="card"><div class="row" style="justify-content:space-between"><button data-a="mo" data-n="-1">‹</button><b>${first.toLocaleString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'})}</b><button data-a="mo" data-n="1">›</button></div>
 <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px;text-align:center" class="mu">${['M','T','W','T','F','S','S'].map(x=>`<div>${x}</div>`).join('')}${cells}</div></div>
 <div class="card"><h2>${S.calDay||'Tap a day'}</h2>${sel.map(vrow).join('')||'<div class="mu">No logged visits. Only actual visits appear here.</div>'}</div>
 <div class="card"><h2>Insights</h2>${insights()}</div>`}
function insights(){const v=S.visits;if(!v.length)return '<div class="mu">Insights appear after you log visits.</div>';const dur=v.filter(x=>x.dep).map(x=>(tm(x.dep)-tm(x.arr))*60),fc={};v.forEach(x=>Object.keys(x.facs||{}).forEach(k=>fc[k]=(fc[k]||0)+1));
 return `Visits: <b>${v.length}</b> · Avg duration: <b>${dur.length?Math.round(dur.reduce((a,b)=>a+b,0)/dur.length):'–'} min</b><br>Facility use: ${Object.keys(fc).map(k=>F[k][0]+' '+fc[k]).join(', ')}<br>With Hannah: ${v.filter(x=>x.hannah).length}`}
function sett(){return `<h1>Settings</h1>
 <div class="card"><h2>Backup &amp; restore your visits</h2><div class="mu" style="margin-bottom:8px">Your visits are stored only on this device and web address. <b>Export</b> after logging, and <b>import</b> to restore or move to a new phone/address. Importing merges and skips duplicates.</div>
 <div class="row"><button class="on" data-a="share">Share / save backup</button><button data-a="copy">Copy backup</button></div>
 <div class="row" style="margin-top:8px"><button data-a="paste">Paste from clipboard &amp; import</button><label style="margin:0;border:1px solid var(--bd);border-radius:14px;padding:11px 14px;color:var(--tx);cursor:pointer">Import file<input type="file" accept=".json,application/json,text/plain" id="file" style="display:none"></label><button data-a="csv">CSV view</button></div>
 <textarea data-k="out" placeholder="Backup text shows here. You can also paste a backup here, then tap Import text." style="margin-top:8px">${esc(S.out)}</textarea><button data-a="imp" style="margin-top:6px;width:100%">Import text above</button><div class="mu" style="margin-top:6px">${S.msg}</div>
 <details style="margin-top:8px"><summary>Step-by-step</summary><div class="mu"><b>Export:</b> tap Share / save backup → choose Save to Files, Notes or AirDrop (or Copy backup, then paste into Notes).<br><b>Import on a new device:</b> open the app → Settings → copy the backup text → tap “Paste from clipboard &amp; import”, or tap Import file and pick the saved .json.<br>Moving to a new web address counts as a new device.</div></details></div>
 <div class="card"><h2>Opening hours</h2>${hoursTable()}</div>
 <div class="card"><h2>Appearance</h2><div class="mu">Choose a colour theme and text size. Stored on this device.</div><div class="row chips" style="margin-top:8px">${[['dl','Purple'],['brown','Brown'],['mono','Black/white'],['light','Light']].map(t=>`<button class="${(S.cfg.theme||'dl')==t[0]?'on':''}" data-a="theme" data-k="${t[0]}">${t[1]}</button>`).join('')}</div><div class="row chips" style="margin-top:8px">${[['s','Small'],['m','Medium'],['l','Large']].map(t=>`<button class="${(S.cfg.size||'m')==t[0]?'on':''}" data-a="size" data-k="${t[0]}">${t[1]}</button>`).join('')}</div></div><div class="card"><h2>Header logo</h2><div class="mu">Add your own club logo image. It is stored only on this device.</div><div class="row" style="margin-top:8px"><label style="margin:0;border:1px solid var(--bd);border-radius:14px;padding:11px 14px;color:var(--tx);cursor:pointer">Choose image<input type="file" accept="image/*" id="logo" style="display:none"></label>${S.cfg.logo?'<button data-a="rmlogo">Remove</button>':''}</div></div><div class="card"><h2>Model</h2><div class="mu">Estimate = (k × initial estimate + Σ weight × your ratings) ÷ (k + Σ weight), per 30-minute slot, matched on weekday/weekend. Weights halve every N days. Rating r maps to ~(r×20−10)% busy. Confidence: Low &lt;3 observations, High ≥8 with low spread, else Medium. Initial profiles are generic assumptions, not club data.</div>
 <label>Recency half-life (days)</label><input type="number" data-k="cfg.half" value="${S.cfg.half}"><label>Shrinkage k</label><input type="number" step="0.5" data-k="cfg.k" value="${S.cfg.k}"></div>
 <div class="card"><h2>iPhone &amp; Gym Mode</h2><div class="mu">Safari → Share → Add to Home Screen. In Shortcuts: Set Focus (Fitness) → Open URL (this app's address + #log). NFC: Automation → NFC → run that shortcut. A web page cannot toggle Focus itself.</div></div>
 <div class="card"><h2>Danger zone</h2><button class="del" data-a="wipe">Delete all visits…</button></div>`}
const TABS=[['dash','◉','Today'],['hm','▦','Heatmap'],['log','＋','Log'],['cal','▤','History'],['set','⚙','Settings']];
function applyTheme(){const r=document.documentElement;r.dataset.theme=S.cfg.theme||'dl';r.style.fontSize={s:'14px',m:'16px',l:'18px'}[S.cfg.size||'m']}function render(){applyTheme();const y=window.scrollY;document.getElementById('app').innerHTML={dash,hm:heat,log:logv,cal,set:sett}[S.tab]();document.getElementById('nav').innerHTML=TABS.map(t=>`<button data-a="tab" data-k="${t[0]}" class="${S.tab===t[0]?'on':''}"><b>${t[1]}</b>${t[2]}</button>`).join('');const lg=document.getElementById('logo');if(lg)lg.onchange=()=>{const x=lg.files[0];if(!x)return;const im=new Image(),u=URL.createObjectURL(x);im.onload=async()=>{const s=Math.min(1,240/im.height),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.cfg.logo=c.toDataURL('image/png');await save();URL.revokeObjectURL(u);render()};im.src=u};const fl=document.getElementById('file');if(fl)fl.onchange=async()=>{const x=fl.files[0];if(x)await doImport(await x.text());render()}}
function setp(path,val){const[a,b]=path.split('.');if(b){S[a][b]=a=='cfg'?+val||S.cfg[b]:val;if(a=='cfg')save()}else S[a]=val}
const json=()=>JSON.stringify({app:'dlci',version:1,exported:now().date,visits:S.visits,cfg:{half:S.cfg.half,k:S.cfg.k}},null,1);
async function marked(){S.cfg.bk=now().date;await save()}
async function doImport(txt){try{const j=JSON.parse(txt);if(!j||j.app!=='dlci'||!Array.isArray(j.visits))throw 0;const ids=new Set(S.visits.map(v=>v.id));let add=0,skip=0;j.visits.forEach(v=>{if(v&&v.id&&v.date&&v.arr&&!ids.has(v.id)){S.visits.push(v);ids.add(v.id);add++}else skip++});await save();S.msg=`Imported ${add} new visits, skipped ${skip} duplicates/invalid.`}catch(x){S.msg='That is not a valid Club Intelligence backup. Nothing was changed.'}}
let saving=false;
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;setp(k,e.target.type=='checkbox'?e.target.checked:e.target.value);if(k=='date')render()});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,d=el.dataset;S.msg='';
 if(a=='tab'){S.tab=d.k;S.sel=null}else if(a=='fac'){S.fac=d.k;S.sel=null}else if(a=='sel'){S.sel=+d.t}else if(a=='cell'){S.sel={t:+d.t,w:+d.w}}
 else if(a=='slot'){const h=clamp(parseInt(S.f.arr)+ +d.n,0,22),p=x=>String(x).padStart(2,'0')+':00';S.f.arr=p(h);S.f.dep=p(h+1)}else if(a=='ft'){const o=S.f.facs;o[d.k]?delete o[d.k]:o[d.k]={r:0,acts:[]}}else if(a=='rate'){S.f.facs[d.k].r=+d.r}
 else if(a=='act'){const x=S.f.facs[d.k].acts,i=x.indexOf(d.t);i<0?x.push(d.t):x.splice(i,1)}
 else if(a=='save'){if(saving)return;if(!S.f.arr){S.msg='Add an arrival time.';return render()}saving=true;S.visits.push({id:Date.now()+''+Math.random().toString(36).slice(2,6),...S.f,facs:JSON.parse(JSON.stringify(S.f.facs))});await save();S.msg='';S.calDay=S.f.date;S.cal=S.calDay.slice(0,7);S.f=null;S.tab='cal';saving=false}
 else if(a=='del'){if(!confirm('Delete this visit?'))return;S.visits=S.visits.filter(v=>v.id!==d.id);await save()}
 else if(a=='day'){S.calDay=d.d}else if(a=='mo'){const[Y,M]=(S.cal||now().date.slice(0,7)).split('-').map(Number);S.cal=new Date(Date.UTC(Y,M-1+ +d.n,1)).toISOString().slice(0,7)}
 else if(a=='copy'){S.out=json();try{await navigator.clipboard.writeText(S.out);await marked();S.msg='Copied ✓ Paste it into Notes or Files to keep it safe.'}catch(x){S.msg='Could not auto-copy. Select the text below and copy it manually.'}}
 else if(a=='share'){S.out=json();try{const f=new File([S.out],'club-intelligence-backup.json',{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Club Intelligence backup'});else await navigator.share({title:'Club Intelligence backup',text:S.out});await marked();S.msg='Shared ✓'}catch(x){S.msg='Share not available here. Use Copy backup, or copy the text below.'}}
 else if(a=='paste'){try{S.out=await navigator.clipboard.readText();await doImport(S.out)}catch(x){S.msg='Clipboard blocked. Paste into the box below and tap Import text.'}}
 else if(a=='csv'){S.out='date,arrive,leave,hannah,gym,pool,spa,clubroom,notes\n'+S.visits.map(v=>[v.date,v.arr,v.dep||'',v.hannah?1:0,...Object.keys(F).map(k=>v.facs[k]?v.facs[k].r||'seen':''),'"'+(v.notes||'').replace(/"/g,'""')+'"'].join(',')).join('\n')}
 else if(a=='imp'){await doImport(S.out)}else if(a=='rmlogo'){delete S.cfg.logo;await save()}else if(a=='theme'){S.cfg.theme=d.k;await save()}else if(a=='size'){S.cfg.size=d.k;await save()}
 else if(a=='wipe'){if(confirm('Permanently delete ALL visits? Export a backup first.')&&confirm('Really delete everything?')){S.visits=[];await save()}}
 render()});
(async()=>{await load();if(location.hash=='#log')S.tab='log';render()})();
</script></body></html>
